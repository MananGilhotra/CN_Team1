# =====================================================================
# Team 1 edge - runs on Mac 2 (10.7.21.240)
# Installed at: /opt/homebrew/etc/nginx/servers/team1.conf
#   (Homebrew's main nginx.conf includes every file in servers/)
# Test + start: sudo nginx -t && sudo nginx
# Reload:       sudo nginx -s reload
# Access log:   tail -f /opt/homebrew/var/log/nginx/team1_access.log
# =====================================================================

# Access log format that shows which backend served each request
log_format lb '$remote_addr:$remote_port -> $upstream_addr [$time_local] '
              '"$request" $status X-Backend=$upstream_http_x_backend';

# Load-balancing pool (round-robin by default)
upstream team1_backends {
    server 10.7.22.147:3001 max_fails=1 fail_timeout=10s;   # Backend A - Mac 3
    server 10.7.19.69:3002  max_fails=1 fail_timeout=10s;   # Backend B - Mac 4
}

# Plain HTTP -> redirect to HTTPS
server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

# HTTPS edge: TLS terminates here
server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/app.team1.test.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.team1.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/team1_access.log lb;

    location / {
        proxy_pass http://team1_backends;                     # forward as plain HTTP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;                             # give up on a dead backend fast
        proxy_next_upstream error timeout http_502 http_503;  # ...and retry the other one
        add_header X-Edge "mac2-nginx" always;
    }
}
