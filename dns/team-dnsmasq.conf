# =====================================================================
# Team 1 private DNS - runs on Mac 1 (10.7.24.11)
# Installed at: /opt/homebrew/etc/dnsmasq.conf
# Start:        sudo brew services start dnsmasq
# Live log:     sudo tail -f /tmp/dnsmasq.log
# =====================================================================

# Answer only on loopback and Mac 1's LAN address
listen-address=127.0.0.1,10.7.24.11
bind-interfaces

# Names that are not ours go to public DNS (internet keeps working)
no-resolv
server=1.1.1.1
server=8.8.8.8

# team1.test belongs to us: never forward it upstream
local=/team1.test/

# Project records: both names point at Mac 2 (nginx edge)
host-record=app.team1.test,10.7.21.240
host-record=api.team1.test,10.7.21.240

# TTL (seconds) for our own records - used in the Phase 2 TTL demo
local-ttl=30

# Log every query so we can show them arriving live
log-queries
log-facility=/tmp/dnsmasq.log
